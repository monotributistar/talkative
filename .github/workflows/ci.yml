name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: talkative_ci
          POSTGRES_USER: talkative
          POSTGRES_PASSWORD: talkative
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talkative -d talkative_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Deploy migrations on fresh PostgreSQL
        run: npm run prisma:migrate:deploy --workspace backend
        env:
          DATABASE_URL: postgresql://talkative:talkative@localhost:5432/talkative_ci?schema=public

      - name: Verify migration status
        run: npm run prisma:migrate:status --workspace backend
        env:
          DATABASE_URL: postgresql://talkative:talkative@localhost:5432/talkative_ci?schema=public

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate feature contracts
        run: npm run test:contracts

      - name: Test backend
        run: npm run test:backend

      - name: Build
        run: npm run build
